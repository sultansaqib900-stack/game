<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0620" />
  <meta name="description" content="Gem Cascade — a colorful match-3 puzzle game. Swap gems, make matches, trigger specials and reach the target score!" />
  <title>Gem Cascade — Match-3 Puzzle</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,4 60,40 96,50 60,60 50,96 40,60 4,50 40,40' fill='%23a78bfa'/%3E%3C/svg%3E" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(120% 120% at 50% 0%, #2a1a4a 0%, #140a2e 55%, #0d0620 100%);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #game {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game canvas {
      display: block;
      border-radius: 0;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Phaser 3 (vendored, no network required) -->
  <script src="lib/phaser.min.js"></script>
  <!-- Game entry point -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
